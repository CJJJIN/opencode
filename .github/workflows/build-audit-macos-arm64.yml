name: Build AuditHelper macOS ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "audit/**"

jobs:
  build-cli-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build Audit CLI Sidecar (macOS ARM64)
        run: |
          cd packages/opencode
          bun ./script/build.ts --single --skip-install
        env:
          OPENCODE_EDITION: audit
          OPENCODE_VERSION: 1.0.0

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-macos-audit-arm64:
    runs-on: macos-14
    needs: build-cli-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-

      - name: Install dependencies
        run: bun install

      - name: Prepare macOS ARM64 sidecar
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts
        env:
          RUST_TARGET: aarch64-apple-darwin
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Build Audit macOS ARM64 App
        run: bun --cwd packages/desktop tauri build -c src-tauri/tauri.audit.conf.json --target aarch64-apple-darwin --bundles app,dmg -- --features audit-edition
        env:
          OPENCODE_EDITION: audit
          OPENCODE_VERSION: 1.0.0

      - name: Upload APP bundle
        uses: actions/upload-artifact@v4
        with:
          name: AuditHelper-macos-arm64-app
          path: packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AuditHelper-macos-arm64-dmg
          path: packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/AuditHelper_1.0.0_*.dmg
          if-no-files-found: warn
