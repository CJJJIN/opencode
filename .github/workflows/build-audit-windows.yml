name: Build AuditHelper Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "audit/**"

jobs:
  build-cli:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build Audit CLI Sidecar
        run: |
          cd packages/opencode
          bun ./script/build.ts --single
        env:
          OPENCODE_EDITION: audit
          OPENCODE_VERSION: 1.0.0

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-windows-audit:
    runs-on: windows-latest
    needs: build-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            packages\desktop\src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: bun install

      - name: Prepare Windows sidecar
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts
        env:
          RUST_TARGET: x86_64-pc-windows-msvc
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Clean previous NSIS bundles
        run: |
          Remove-Item -Recurse -Force packages\desktop\src-tauri\target\release\bundle\nsis -ErrorAction SilentlyContinue

      - name: Build Audit Windows App
        run: bun --cwd packages/desktop tauri build -c src-tauri/tauri.audit.conf.json --bundles nsis -- --features audit-edition
        env:
          OPENCODE_EDITION: audit
          OPENCODE_VERSION: 1.0.0

      - name: Upload NSIS EXE
        uses: actions/upload-artifact@v4
        with:
          name: AuditHelper-windows-exe
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
