name: Build AuditHelper Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "audit/**"

jobs:
  build-windows-audit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            packages\desktop\src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: bun install

      - name: Build Audit Windows App
        run: bun run build:audit

      - name: Upload NSIS EXE
        uses: actions/upload-artifact@v4
        with:
          name: AuditHelper-windows-exe
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: AuditHelper-windows-msi
          path: packages/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
